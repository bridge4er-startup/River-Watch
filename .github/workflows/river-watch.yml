name: River Watch

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: river-watch-pages
  cancel-in-progress: false

jobs:
  poll-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ADMIN_EMAIL: bridge4er@gmail.com
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 465
      SMTP_USER: bridge4er@gmail.com
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Poll DHM and refresh static data
        run: node server.js --poll-once

      - name: Commit refreshed data
        if: github.event_name != 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update River Watch data"
          file_pattern: "data/state.json public/data/snapshot.json"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
